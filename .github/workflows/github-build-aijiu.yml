name: Build and publish StarHub
on:
  workflow_dispatch:
concurrency:
  group: starhub-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Extract StarHub source
        run: unzip -q StarHub-source.zip -d source
      - name: Test Swift cloud catalog parser
        run: bash source/AIJIU-iOS/tests/run-cloud-tests.sh
      - name: Compile iOS 16 arm64 and package IPA
        run: bash source/AIJIU-iOS/build-ipa.sh
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: StarHub-iOS-IPA
          path: source/AIJIU-iOS/build/StarHub-1.2.0-arm64-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Extract StarHub source
        run: unzip -q StarHub-source.zip -d source
      - name: Use JDK 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '8.11.1'
      - name: Restore stable StarHub signing identity
        env:
          STARHUB_KEYSTORE_B64: ${{ secrets.STARHUB_ANDROID_KEYSTORE_B64 }}
        run: |
          umask 077
          test -n "$STARHUB_KEYSTORE_B64"
          printf '%s' "$STARHUB_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/starhub-release.p12"
          echo "STARHUB_KEYSTORE_FILE=$RUNNER_TEMP/starhub-release.p12" >> "$GITHUB_ENV"
      - name: Test catalog parser and compile signed Android APK
        env:
          STARHUB_KEYSTORE_PASSWORD: ${{ secrets.STARHUB_ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --project-dir source/AIJIU-Android :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature and version
        run: |
          APK=source/AIJIU-Android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > apk-signature.txt
          cat apk-signature.txt
          grep -Fi 'Signer #1 certificate SHA-256 digest: 1B4B154E2C00A943206163AA585CDB4C0B2BA5BDE9F8788C5754D4B6F12B6BE4' apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > apk-badging.txt
          sed -n '1,6p' apk-badging.txt
          cp "$APK" StarHub-Android-1.2.0.apk
          sha256sum StarHub-Android-1.2.0.apk
      - name: Remove runner copy of signing identity
        if: always()
        run: rm -f "$RUNNER_TEMP/starhub-release.p12"
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: StarHub-Android-APK
          path: StarHub-Android-1.2.0.apk
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [ios, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: StarHub-*
          path: packages
      - name: Publish installers and checksums to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp packages/StarHub-iOS-IPA/StarHub-1.2.0-arm64-unsigned.ipa dist/
          cp packages/StarHub-Android-APK/StarHub-Android-1.2.0.apk dist/
          (cd dist && sha256sum *.ipa *.apk > SHA256SUMS.txt)
          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh release upload v1.2.0 dist/* --clobber
            gh release edit v1.2.0 --title '星枢 StarHub 1.2.0 · 云端同步版' --notes-file release-notes.md --latest
          else
            gh release create v1.2.0 dist/* --target "$GITHUB_SHA" --title '星枢 StarHub 1.2.0 · 云端同步版' --notes-file release-notes.md --latest
          fi
          gh release view v1.2.0 --json url,assets
